name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate ECR configuration
        working-directory: infra/ecr
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate application configuration
        working-directory: infra/application
        run: |
          terraform init -backend=false -input=false
          terraform validate

  python-tests:
    name: Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - vehicles
          - subscriptions
          - monitoring
          - notifications

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: python -m pip install -r requirements.txt

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: python -m pytest
